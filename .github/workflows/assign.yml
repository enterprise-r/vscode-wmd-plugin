name: Assign

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    if: ${{ !(github.event.issue || github.event.pull_request).assignees[0] }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSIGNEE: ${{ vars.ASSIGNEE || 'neg3ntropy' }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: >-
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$NUMBER/assignees"
          -f "assignees[]=$ASSIGNEE" --silent
